# =============================================================================
# Java Agent — Java/Spring Boot project coding agent
# Modify workspace.path and target to match your project.
# =============================================================================

agent:
  name: "java-agent"
  category: "coding"
  description: "Java/Spring Boot coding agent — implements features, fixes bugs, writes tests"

engine:
  # runtime/model are resolved from executor.yaml default_strategy/model_map.
  # You may set them here to force this agent to a specific backend.
  max_turns: 200
  tools:
    - Read
    - Write
    - Edit
    - Bash
    - Glob
    - Grep
  security:
    # Codex CLI: filesystem sandbox. Recommended default for coding/workspace tasks.
    # Values: read-only | workspace-write | danger-full-access
    sandbox: workspace-write
    # Claude Code only: enforced through PreToolUse hook.
    # Codex CLI does not enforce this command allowlist.
    allowed_commands:
      # common utilities
      - ls
      - cat
      - find
      - grep
      - head
      - tail
      - wc
      - pwd
      - mkdir
      - cp
      - rm
      - mv
      - chmod
      - curl        # for health-check / smoke test
      - git
      # java ecosystem
      - java
      - mvn
      - ./mvnw
      - gradle
      - ./gradlew

session:
  mode: "multi_round"
  prompts:
    worker: "java/worker.md"
    vibe:   "java/vibe.md"
  # When task_list.json is missing:
  # - Default: auto-invokes planner-agent to generate it
  # - With --skip-planner: agent generates its own task_list.json (self-plan mode)

git:
  branch_per_task: true
  use_worktree: true
  base_branch: "main"
  auto_commit: true
  auto_push: false

pipeline:
  # Integration test after all features pass (optional)
  # post_task_test:
  #   enabled: true
  #   command: "./mvnw verify -pl integration-tests"
  #   max_cycles: 3
  #   timeout: 600

workspace:
  path: "./workspace/java-agent"

# target is set project-wide in executor.yaml.
# Uncomment below to override for this agent only:
# target: "/path/to/override"
# For monorepo: set target_scope to your subdirectory.
# target_scope: "backend"
