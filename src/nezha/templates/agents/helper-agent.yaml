# =============================================================================
# Helper Agent 配置
# 统一控制面板 — 顾问分析 + 操作执行，所有 nezha 操作的交互入口
# category: management — 无 target，cwd = task_workspace
# =============================================================================

agent:
  name: "helper-agent"
  category: "management"
  callable: true
  description: "统一控制面板 agent，分析代码、解答问题、提供建议，同时可执行 feature/agent/git 等操作命令"

engine:
  # runtime/model are resolved from executor.yaml default_strategy/model_map.
  # You may set them here to force this agent to a specific backend.
  env: {}
  max_turns: 50
  tools:
    - Read
    - Write
    - Glob
    - Grep
    - Bash
  security:
    # Codex CLI: filesystem sandbox. Recommended default for coding/workspace tasks.
    # Values: read-only | workspace-write | danger-full-access
    sandbox: workspace-write
    # Claude Code only: enforced through PreToolUse hook.
    # Codex CLI does not enforce this command allowlist.
    allowed_commands:
      - ls
      - cat
      - head
      - tail
      - wc
      - find
      - git
      - nezha
      - echo
      - diff
      - grep

session:
  mode: "single_round"
  prompts:
    worker: "helper/worker.md"

workspace:
  path: "./workspace/helper-agent"
